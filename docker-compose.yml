services:
  postgres:
    image: postgres:16-alpine
    container_name: guinacarautomotive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guinacarautomotive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - guinacarautomotive-db-data:/var/lib/postgresql/data

volumes:
  guinacarautomotive-db-data:
