spring.application.name=guinacarautomotive
server.port=8081

# Conexão com o PostgreSQL (porta padrão 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/guinacarautomotive
spring.datasource.username=postgres
spring.datasource.password=root

# Configurações do Hibernate (cria as tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# JWT
# Gere um segredo forte (ex.: openssl rand -base64 64) e exporte como
# variavel de ambiente JWT_SECRET. O valor abaixo e apenas um fallback de
# desenvolvimento e NAO deve ser usado em producao.
# ==========================================
app.jwt.secret=9a3f2c5d8b7e4a1f6c9d2b5e8a3f1c4d7b0e9a2f5c8b1d4e7a0f3c6d9b2e5a8
app.jwt.expiration-ms=86400000


